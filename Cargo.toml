[package]
name = "libre-ai-authz-biscuit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "EUPL-1.2"
repository = "https://github.com/libre-ai/authz-biscuit"
publish = false

[dependencies]
biscuit-auth = { version = "=5.0.0", default-features = false }
biscuit-parser-legacy = { package = "biscuit-parser", version = "=0.1.2" }
sha2 = { version = "=0.11.0", default-features = false }
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[workspace]
